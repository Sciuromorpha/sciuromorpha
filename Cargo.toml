[workspace]
resolver = "2"
members = [
    "crates/sciuromorpha-common",
    "crates/sciuromorpha-core",
    "crates/ingest-agent-media",
    "crates/media-agent",
    "crates/storage-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.12"
async-nats = "0.38"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
meilisearch-sdk = "0.27"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

sciuromorpha-common = { path = "crates/sciuromorpha-common" }
